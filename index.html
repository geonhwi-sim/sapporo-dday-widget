<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffdf8">
<title>눈 오는 날의 D-day</title>
<style>
  :root { color-scheme: light; --ink:#3f5060; --muted:#8a9cab; --blue:#9dc3da; --blue-deep:#638daa; --ice:#edf6fa; --cream:#fffdf8; --berry:#bd777d; --line:#dce8ec; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:10px; background:transparent; color:var(--ink); font-family:ui-rounded,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; }
  .card { width:min(100%,400px); overflow:hidden; position:relative; isolation:isolate; padding:21px 23px 17px; border:1px solid #e8e5dc; border-radius:26px; background:radial-gradient(ellipse at 12% 0%,rgba(255,255,255,.98),transparent 55%),linear-gradient(155deg,#fffefb 5%,#f7fbfd 100%); box-shadow:0 9px 24px rgba(78,111,132,.13),inset 0 2px 0 rgba(255,255,255,.96),inset 0 -2px 0 rgba(194,217,229,.26); }
  .card::before { content:""; position:absolute; z-index:-1; inset:6px; border:1px solid rgba(255,255,255,.72); border-radius:20px; pointer-events:none; }
  .card::after { content:""; position:absolute; z-index:-1; width:150px;height:150px;right:-62px;top:-92px;border-radius:50%;background:radial-gradient(circle,rgba(190,220,235,.35),rgba(190,220,235,0) 70%);pointer-events:none; }
  .topline { position:relative; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
  .flake { color:var(--blue); font-size:15px; line-height:1; text-shadow:0 1px 0 white,0 2px 4px rgba(99,141,170,.18); }
  .series { width:min(100%,220px); padding:2px 0; border:0; border-bottom:1px solid transparent; outline:0; background:transparent; color:var(--muted); font-size:10px; line-height:1.2; font-weight:700; font-family:inherit; letter-spacing:.15em; }
  .series:focus { border-bottom-color:#cadce5; }
  .series::placeholder { color:#a9bac6; }
  .event { display:block; width:100%; margin:10px 0 0; padding:0; border:0; outline:0; background:transparent; color:var(--ink); font-size:clamp(20px,5vw,25px); line-height:1.3; font-weight:750; font-family:inherit; letter-spacing:-.04em; text-shadow:0 1px 0 rgba(255,255,255,.85); }
  .event::placeholder { color:#afbdc6; }
  .date-row { margin-top:11px; display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12px; }
  input[type=date] { min-width:0; padding:7px 9px; border:1px solid #dce8ed; border-radius:11px; background:linear-gradient(180deg,#fff,rgba(245,250,252,.92)); box-shadow:inset 0 1px 0 white,0 2px 4px rgba(109,151,175,.06); color:var(--blue-deep); font-size:12px; font-weight:650; font-family:inherit; }
  .count-area { min-height:105px; margin-top:13px; padding:8px 11px; display:flex; align-items:center; justify-content:center; gap:6px; border:1px solid rgba(218,232,239,.84); border-radius:20px; background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.93),transparent 62%),linear-gradient(145deg,#eef7fb,#f7faf9); box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(192,218,231,.18); }
  .globe { flex:0 0 auto; width:47px; height:58px; object-fit:contain; margin-right:1px; filter:drop-shadow(0 3px 3px rgba(95,131,153,.17)); }
  .prefix { color:var(--blue-deep); font-size:clamp(23px,6vw,29px); font-weight:750; letter-spacing:-.06em; text-shadow:0 1px 0 white,0 2px 4px rgba(99,141,170,.14); }
  .number { color:#77a8c5; font-size:clamp(58px,15vw,76px); font-weight:800; letter-spacing:-.09em; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 2px 0 white,0 3px 5px rgba(99,141,170,.17); }
  .number.today { color:var(--berry); }
  .unit { align-self:center; margin:21px 0 0 -2px; color:var(--muted); font-size:14px; font-weight:650; }
  .hint { min-height:18px; margin:8px 0 0; text-align:center; color:var(--muted); font-size:11px; }
  .foot { display:flex; justify-content:center; align-items:center; gap:7px; margin-top:12px; color:#a4b3bb; font-size:9px; letter-spacing:.08em; }
  .foot::before,.foot::after { content:""; width:21px; height:1px; background:#dce8ed; }
  @media(max-width:400px){.card{padding:19px 17px 15px;border-radius:22px}.count-area{min-height:96px}.globe{width:42px;height:52px}}
  @media(prefers-reduced-motion:no-preference){input{transition:border-color .18s ease,box-shadow .18s ease}input:focus-visible{box-shadow:0 0 0 3px rgba(157,195,218,.16)}}
</style>
</head>
<body>
<main class="card" aria-label="디데이 위젯">
  <div class="topline"><span class="flake" aria-hidden="true">✳</span><input class="series" id="series" type="text" maxlength="24" aria-label="상단 문구" placeholder="SECTION LABEL"></div>
  <input class="event" id="event" type="text" maxlength="28" aria-label="일정 이름" placeholder="기다리는 날의 이름">
  <div class="date-row"><span>날짜</span><input id="date" type="date" aria-label="목표 날짜"></div>
  <section class="count-area" aria-live="polite">
    <img class="globe" src="snow-globe.png" alt="" aria-hidden="true">
    <span class="prefix" id="prefix">D-</span><span class="number" id="number">—</span><span class="unit" id="unit"></span>
  </section>
  <p class="hint" id="hint">일정 이름과 날짜를 입력해 주세요.</p>
  <div class="foot">A LITTLE CLOSER EACH DAY</div>
</main>
<script>
(() => {
  const seriesInput = document.querySelector('#series');
  const eventInput = document.querySelector('#event');
  const dateInput = document.querySelector('#date');
  const prefix = document.querySelector('#prefix');
  const number = document.querySelector('#number');
  const unit = document.querySelector('#unit');
  const hint = document.querySelector('#hint');
  try {
    seriesInput.value = localStorage.getItem('sapporo-dday-series') || 'WINTER PLANS';
    eventInput.value = localStorage.getItem('sapporo-dday-title') || '삿포로 여행';
    dateInput.value = localStorage.getItem('sapporo-dday-date') || '';
  } catch (_) { seriesInput.value = 'WINTER PLANS'; eventInput.value = '삿포로 여행'; }
  seriesInput.addEventListener('input', () => { try { localStorage.setItem('sapporo-dday-series', seriesInput.value); } catch (_) {} });
  function render() {
    const title = eventInput.value.trim();
    const raw = dateInput.value;
    try { localStorage.setItem('sapporo-dday-title', eventInput.value); localStorage.setItem('sapporo-dday-date', raw); } catch (_) {}
    if (!raw) { prefix.textContent='D-'; number.textContent='—'; unit.textContent=''; number.classList.remove('today'); hint.textContent='일정 이름과 날짜를 입력해 주세요.'; return; }
    const [y,m,d] = raw.split('-').map(Number);
    const target = Date.UTC(y,m-1,d);
    const now = new Date();
    const today = Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
    const days = Math.round((target-today)/86400000);
    number.classList.toggle('today',days===0);
    if (days > 0) { prefix.textContent='D-'; number.textContent=days.toLocaleString('ko-KR'); unit.textContent='일'; hint.textContent=title ? `${title}까지 ${days}일 남았어요.` : `목표일까지 ${days}일 남았어요.`; }
    else if (days === 0) { prefix.textContent='D'; number.textContent='DAY'; unit.textContent=''; hint.textContent=`오늘이에요${title ? ` · ${title}` : ''}!`; }
    else { prefix.textContent='D+'; number.textContent=Math.abs(days).toLocaleString('ko-KR'); unit.textContent='일'; hint.textContent=title ? `${title}이(가) ${Math.abs(days)}일 지났어요.` : `목표일이 ${Math.abs(days)}일 지났어요.`; }
  }
  eventInput.addEventListener('input',render); dateInput.addEventListener('input',render); render();
  setInterval(render,60000);
})();
</script>
</body>
</html>
